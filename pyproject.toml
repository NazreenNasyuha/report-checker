[project]
name = "template-audit-ai"
version = "2.0.0"
description = "Local-first Master .MD Standard Builder & Read-Only Technical PDF Auditor powered by FastAPI, PyMuPDF, SymPy, and Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.10",
    "sympy>=1.12",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
